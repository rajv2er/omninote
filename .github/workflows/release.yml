name: Release

# Builds the signed-less desktop bundles and attaches them to a GitHub Release.
#
# Trigger a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it manually from the Actions tab (Release -> Run workflow) with a tag
# name, which is useful for a dry run without touching your local repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write # create releases and upload assets

jobs:
  release:
    # Apple Silicon. Add `macos-15-intel` to a matrix to also ship Intel dmg.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stable Rust; the app only uses stable features (rust-version 1.77.2).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and src-tauri/target between runs.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The updater compares the release against the version baked into the
      # bundle, so the tag is the single source of truth: v0.2.0 must ship a
      # bundle that reports 0.2.0, or clients will never see the update.
      - name: Sync version from tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          VERSION="$VERSION" node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n");'

      # Runs `npm run build` (beforeBuildCommand) then bundles, then uploads
      # every bundle (.app, .dmg) to the release.
      # APPLE_SIGNING_IDENTITY="-" = free ad-hoc sign (no $99 Developer ID).
      # This is what stops Apple Silicon Macs reporting the app as "damaged".
      # It does NOT remove Gatekeeper entirely — users still need one
      # `xattr` command on first install (see releaseBody below).
      #
      # TAURI_SIGNING_PRIVATE_KEY = contents of the updater private key
      # (repo Settings -> Secrets -> Actions). With it set, tauri-action also
      # signs the updater bundle (.app.tar.gz) and uploads `latest.json`,
      # which is what the in-app "Check for Updates" polls.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "OmniNote v__VERSION__"
          releaseBody: |
            See the assets below to download OmniNote for macOS.

            **Already have OmniNote installed?** You don't need this download —
            open the app and use *Check for Updates* (bottom of the library
            sidebar). It updates itself and restarts.

            **Install (free build, no Apple Developer ID):**
            1. Open the `.dmg` and drag OmniNote to Applications.
            2. Run this once in Terminal (removes Gatekeeper quarantine):

            `xattr -dr com.apple.quarantine /Applications/OmniNote.app`

            Then open OmniNote normally. If macOS still says "damaged"
            (v0.1.0 builds), also run:

            `codesign --force --deep -s - /Applications/OmniNote.app`

            Why: Apple only skips this step for $99/yr notarised apps.
            This build is ad-hoc signed instead, so Gatekeeper needs the manual allow.
            No account, no data leaves your Mac.

            **No install?** Use the web version: `npm run build`, then host `dist/`
            (e.g. GitHub Pages) — same notebook, no Gatekeeper.
          releaseDraft: false
          prerelease: false

      - name: Verify ad-hoc signature
        if: always()
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n 1)
          echo "Verifying $APP"
          codesign --verify --verbose "$APP"
          codesign -dv --verbose=4 "$APP" | head -n 20
